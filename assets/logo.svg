<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="gitundo logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- rounded square -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#0b1220"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9"/>
  <!-- undo arrow (circular) -->
  <g fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round">
    <path d="M48 42 a34 34 0 1 1 -13 29" />
  </g>
  <g fill="url(#ring)">
    <path d="M27 40 L27 78 L50 60 Z" />
  </g>
  <!-- checkmark -->
  <g fill="none" stroke="#0b1220" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79 78 L92 92 L110 62"/>
  </g>
</svg>
