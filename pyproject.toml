[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitundo"
version = "0.1.0"
description = "The undo button git never had. Automatic safety-net snapshots for any git repo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitundo contributors" }]
keywords = [
    "git", "undo", "checkpoint", "snapshot", "backup", "reset", "recovery",
    "developer-tools", "cli", "version-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/<owner>/gitundo"
Repository = "https://github.com/<owner>/gitundo"
Documentation = "https://github.com/<owner>/gitundo#readme"
"Bug Tracker" = "https://github.com/<owner>/gitundo/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
gitundo = "gitundo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitundo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["gitundo"]
