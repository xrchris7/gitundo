name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest --cov=gitundo --cov-report=term-missing
      - name: Package sanity
        run: python -m pip wheel . -w dist --no-deps && ls dist

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check src tests

  vscode:
    name: VS Code extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: extensions/vscode
      - name: Type-check
        run: npm run compile
        working-directory: extensions/vscode
      - name: Package .vsix
        run: npx vsce package --no-dependencies
        working-directory: extensions/vscode
      - uses: actions/upload-artifact@v7
        with:
          name: gitundo-vscode
          path: extensions/vscode/*.vsix

  release:
    name: Release to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python -m pip install build && python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-vscode:
    name: Publish VS Code extension
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, vscode]
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Publish to Marketplace
        env:
          VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
        working-directory: extensions/vscode
        run: |
          npm ci
          vsce publish -p "$VSCODE_MARKETPLACE_TOKEN" --no-dependencies
